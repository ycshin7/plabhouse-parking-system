name: Daily Parking Allocation

on:
  schedule:
    # CRITICAL FIX: 0-4 means Sunday to Thursday in UTC
    # Sunday 23:00 UTC = Monday 08:00 KST
    # Monday 23:00 UTC = Tuesday 08:00 KST
    # ...
    # Thursday 23:00 UTC = Friday 08:00 KST
    # This ensures Mon-Fri 08:00 KST execution
    - cron: '00 23 * * 0-4'  # Sunday-Thursday at 23:00 UTC → Mon-Fri 08:00 KST
  workflow_dispatch:  # Allow manual trigger

jobs:
  allocate-and-notify:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Allow pushing changes
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        pip install requests pytz
    
    - name: Run allocation and send Slack notification
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      run: |
        set -e  # Exit immediately if any command fails
        python auto_allocate.py
    
    - name: Notify on failure
      if: failure()
      run: |
        echo "❌ Workflow failed! Check logs at: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        # You can add additional notification logic here (e.g., send to a backup channel)
