name: 🅿️ 자동 주차 배정 (백업)

on:
  schedule:
    # Vercel Cron이 지연될 경우를 대비한 백업 (3중)
    # UTC 기준 → KST = UTC + 9
    - cron: '1 15 * * 0-4'   # KST 00:01 (1차 - Vercel과 동시)
    - cron: '30 15 * * 0-4'  # KST 00:30 (2차 백업)
    - cron: '0 16 * * 0-4'   # KST 01:00 (3차 백업)
  workflow_dispatch:

jobs:
  auto-allocate:
    runs-on: ubuntu-latest
    steps:
      - name: 배정 API 호출
        run: |
          echo "⏰ 배정 API 호출 시작: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M:%S KST')"

          RESPONSE=$(curl -s -w "\n%{http_code}" -X GET \
            "${{ secrets.VERCEL_APP_URL }}/api/cron/allocate")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n -1)

          echo "Status: $HTTP_CODE"
          echo "Response: $BODY"

          if [ "$HTTP_CODE" = "200" ]; then
            # 이미 배정 완료된 경우도 200 (skipped:true)
            if echo "$BODY" | grep -q '"skipped"'; then
              echo "ℹ️ 이미 처리됨 (정상)"
            else
              echo "✅ 배정 완료!"
            fi
          else
            echo "❌ 배정 실패 (HTTP $HTTP_CODE)"
            exit 1
          fi
