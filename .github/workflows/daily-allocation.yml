name: Daily Parking Allocation

on:
  schedule:
    # TRIPLE-LAYER RELIABILITY SYSTEM
    # Multiple scheduled times ensure execution even if one fails
    # All times are for Monday-Friday (Sunday-Thursday at 15:00-15:20 UTC = 00:00-00:20 KST)

    # Primary: 00:00 KST (Sunday-Thursday 15:00 UTC)
    - cron: '0 15 * * 0-4'

    # Backup Layer 1: 00:10 KST (Sunday-Thursday 15:10 UTC)
    - cron: '10 15 * * 0-4'

    # Backup Layer 2: 00:20 KST (Sunday-Thursday 15:20 UTC)
    - cron: '20 15 * * 0-4'

    # Note: Duplicate execution prevention ensures only one allocation per day
  
  repository_dispatch:
    types: [daily-allocation]  # Trigger from external cron service (cron-job.org)
  
  workflow_dispatch:  # Allow manual trigger

jobs:
  allocate-and-notify:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Allow pushing changes
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        pip install requests pytz
    
    - name: Run allocation and send Slack notification
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      run: |
        set -e  # Exit immediately if any command fails
        python auto_allocate.py
    
    - name: Notify on failure
      if: failure()
      run: |
        echo "❌ Workflow failed! Check logs at: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        # You can add additional notification logic here (e.g., send to a backup channel)
