name: Daily Parking Allocation

on:
  schedule:
    # CRITICAL FIX for GitHub Actions Schedule Delay
    # GitHub Actions has severe schedule delays (20-30 minutes)
    # Setting to 22:00 UTC (07:00 KST) to ensure execution by 08:01 KST
    # The script has a built-in wait until 08:01 KST, so early start is safe
    # 
    # Sunday 22:00 UTC = Monday 07:00 KST → waits until 08:01 → executes
    # Monday 22:00 UTC = Tuesday 07:00 KST → waits until 08:01 → executes
    # ...
    # Thursday 22:00 UTC = Friday 07:00 KST → waits until 08:01 → executes
    #
    # This ensures Mon-Fri 08:01 KST execution despite GitHub's delays
    - cron: '00 22 * * 0-4'  # Sunday-Thursday at 22:00 UTC → Mon-Fri 07:00-08:01 KST
  workflow_dispatch:  # Allow manual trigger

jobs:
  allocate-and-notify:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Allow pushing changes
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        pip install requests pytz
    
    - name: Run allocation and send Slack notification
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      run: |
        set -e  # Exit immediately if any command fails
        python auto_allocate.py
    
    - name: Notify on failure
      if: failure()
      run: |
        echo "❌ Workflow failed! Check logs at: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        # You can add additional notification logic here (e.g., send to a backup channel)
